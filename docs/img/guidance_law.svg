<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #e8e6dc; }
  .h { font-size: 15px; font-weight: 600; }
  .m { fill: #a8a69e; }
  .bad { fill: #ff7b6b; }
  .grid { stroke: #5f5e5a; }
  .bg { fill: #1f1f1e; }
</style>
<defs><marker id="a1D9E75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a378ADD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a5f5e5a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="aD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="340" rx="10"/>
<text x="20" y="30" class="h">The whole guidance law at the boat</text>
<text x="20" y="50" class="m">Track 090°, 1 m/s stream setting south, boat at 3 m/s, 10 m off the line (not to scale)</text>
<line x1="40" y1="110" x2="640" y2="110" class="grid" stroke-width="1.5" marker-end="url(#a5f5e5a)"/>
<circle cx="40" cy="110" r="4" fill="#888780"/><text x="36" y="98" class="m">A</text><text x="626" y="98" class="m">B</text>
<text x="420" y="98" class="m">track A → B: 090° (atan2)</text>
<line x1="200" y1="182" x2="200" y2="114" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="178" y="152" class="m">e</text>
<line x1="150" y1="168" x2="150" y2="236" stroke="#378ADD" stroke-width="2.5" marker-end="url(#a378ADD)"/>
<text x="60" y="262" style="fill:#85B7EB">tidal stream 1 m/s</text>
<line x1="200" y1="190" x2="480" y2="190" stroke="#888780" stroke-width="1" stroke-dasharray="6 5"/>
<text x="488" y="194" class="m">along the track</text>
<line x1="200" y1="190" x2="452.2" y2="126.9" stroke="#D85A30" stroke-width="2" marker-end="url(#aD85A30)"/>
<text x="460.2" y="130.9" style="fill:#F0997B">course over ground</text>
<line x1="200" y1="190" x2="383.4" y2="68.5" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#a1D9E75)"/>
<text x="391.4" y="68.5" style="fill:#5DCAA5">heading 056.5°</text>
<path d="M270.0 190.0 A70 70 0 0 0 267.9 173.0" fill="none" stroke="#D85A30" stroke-width="2.5"/>
<text x="281.4" y="185.0" class="h" style="fill:#F0997B">θ</text>
<path d="M306.7 163.3 A110 110 0 0 0 291.7 129.3" fill="none" stroke="#1D9E75" stroke-width="2.5"/>
<text x="311.6" y="145.8" class="h" style="fill:#5DCAA5">β</text>
<circle cx="200" cy="190" r="8" fill="#1D9E75"/><text x="186" y="214" class="m">boat</text>
<text x="40" y="296">heading = 090° − β − θ = 090° − 19.5° − 14° = 056.5°</text>
<text x="40" y="320" class="m">θ = arctan(10 / 40) = 14°, back to the line  ·  β = arcsin(1 / 3) = 19.5°, into the current</text>
</svg>
