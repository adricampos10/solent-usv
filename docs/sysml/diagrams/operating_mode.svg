@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle

rec def "OperatingMode" as E1  <<(T,blue) state  def>> [[psysml:d7a2d1a9-4ea8-4310-a8e7-de8cb373ebf1 ]] {
rec usage "Idle" as E2  <<(T,blue) state>> [[psysml:c2ce24e7-2f70-4779-a1d3-65cb8402c473 ]] {
}

rec usage "Manual" as E3  <<(T,blue) state>> [[psysml:d9a3e236-d01f-46d1-888a-291f726b37bc ]] {
}

rec usage "Stopped" as E4  <<(T,blue) state>> [[psysml:723b1198-9e78-4c00-89b9-ac357118628f ]] {
}

desc "OperatingMode" as E1  : **entry** 
[*] - -> E2 [[psysml:b41c3041-9b3e-4cee-88cf-bba0da4899ce ]] 
}

E2  - -> E3 [[psysml:557df286-2cd2-4f48-8ca2-8e03d1d469e7 ]] 
