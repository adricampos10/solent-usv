}

rec usage "Autonomous" as E4  <<(T,blue) state>> [[psysml:3410f2c8-9f71-4a12-ab44-bfca6c94572e ]] {
rec usage "FollowingRoute" as E5  <<(T,blue) state>> [[psysml:948623ce-4ab1-4c7c-8b41-7c2a84e6af29 ]] {
}

rec usage "AvoidingCollision" as E6  <<(T,blue) state>> [[psysml:a7f8d344-1729-4930-95a3-010d1627e345 ]] {
}

desc "Autonomous" as E4  : **entry** 
[*] - -> E5 [[psysml:19248785-f4c5-41fb-be3e-6b7a8df896c7 ]] 
}

rec usage "Stopped" as E7  <<(T,blue) state>> [[psysml:b1c55de2-a21b-4ef1-ba00-a6301d01ee09 ]] {
}

desc "OperatingMode" as E1  : **entry** 
