@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle

rec def "OperatingMode" as E1  <<(T,blue) state  def>> [[psysml:ab38b074-ffe7-4b77-a3ab-5be2f538b11d ]] {
rec usage "Idle" as E2  <<(T,blue) state>> [[psysml:94b32fee-0859-4c33-b1a3-cf5a104851ca ]] {
}

rec usage "Manual" as E3  <<(T,blue) state>> [[psysml:555ea0ca-0e60-4d86-8474-4d604fb39464 ]] {
}

rec usage "Autonomous" as E4  <<(T,blue) state>> [[psysml:d490b0b7-76b8-4bbd-80b2-ee748c64d467 ]] {
rec usage "FollowingRoute" as E5  <<(T,blue) state>> [[psysml:9303531b-6c14-4d9b-bf50-4a089ae9c281 ]] {
}

rec usage "AvoidingCollision" as E6  <<(T,blue) state>> [[psysml:c39105a8-6b05-478c-becf-5c4b6bbb1a2f ]] {
}

desc "Autonomous" as E4  : **entry** 
[*] - -> E5 [[psysml:acf25762-7fe9-4968-8820-34e21a125ca2 ]] 
}

rec usage "Stopped" as E7  <<(T,blue) state>> [[psysml:3903dd58-7828-421b-9741-e01c8c41b73b ]] {
}

desc "OperatingMode" as E1  : **entry** 
[*] - -> E2 [[psysml:7b4806a5-0b54-491d-8f90-85c821ea51e6 ]] 
}

