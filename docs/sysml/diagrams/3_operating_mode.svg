@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle

rec def "OperatingMode" as E1  <<(T,blue) state  def>> [[psysml:2d24c8cd-fc89-4d5f-9525-5d7ccacffdff ]] {
rec usage "Idle" as E2  <<(T,blue) state>> [[psysml:888f6945-8cd3-454e-ba62-6726d2a5447f ]] {
}

rec usage "Manual" as E3  <<(T,blue) state>> [[psysml:282241bf-bcc8-43f9-8aa8-3142785fab4e ]] {
}

rec usage "Autonomous" as E4  <<(T,blue) state>> [[psysml:ba073699-928f-4f40-9e01-c35772359630 ]] {
rec usage "FollowingRoute" as E5  <<(T,blue) state>> [[psysml:2f06336c-c659-4d2b-967a-4d1888148c78 ]] {
}

rec usage "AvoidingCollision" as E6  <<(T,blue) state>> [[psysml:2f8fee85-c58f-4cb8-a230-7d6863ceb33b ]] {
}

desc "Autonomous" as E4  : **entry** 
[*] - -> E5 [[psysml:a727f06a-1733-4b62-aa63-ab64817b9d78 ]] 
}

rec usage "Stopped" as E7  <<(T,blue) state>> [[psysml:97dd9f2d-6b0a-4ad5-bea5-24c9f4178ef7 ]] {
}

desc "OperatingMode" as E1  : **entry** 
[*] - -> E2 [[psysml:b0be3a8c-cb98-4c65-b347-72171f4111c4 ]] 
}

