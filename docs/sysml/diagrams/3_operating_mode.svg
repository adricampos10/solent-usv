@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle

rec def "OperatingMode" as E1  <<(T,blue) state  def>> [[psysml:0c8d9f6c-03b8-425e-8cad-a9dc9d3da9b5 ]] {
rec usage "Idle" as E2  <<(T,blue) state>> [[psysml:917b3ada-8944-4059-9cd0-33a4c2950e63 ]] {
}

rec usage "Manual" as E3  <<(T,blue) state>> [[psysml:01114c8f-907f-44d3-9498-36a2b6b58657 ]] {
}

rec usage "Autonomous" as E4  <<(T,blue) state>> [[psysml:7d2bf55e-204e-4043-891d-f941b6c47bc2 ]] {
rec usage "FollowingRoute" as E5  <<(T,blue) state>> [[psysml:2a990e16-e36b-4f96-a242-bee69c31c13f ]] {
}

rec usage "AvoidingCollision" as E6  <<(T,blue) state>> [[psysml:de79e559-8ba7-456f-bcce-d6927a50a08b ]] {
}

desc "Autonomous" as E4  : **entry** 
[*] - -> E5 [[psysml:9338981f-5b38-47a5-82ec-a5562741c4f2 ]] 
}

rec usage "Stopped" as E7  <<(T,blue) state>> [[psysml:b0979317-1c3b-4b93-8a1a-37b4a0f74d33 ]] {
}

desc "OperatingMode" as E1  : **entry** 
[*] - -> E2 [[psysml:b25bb23d-5729-4396-9ed2-23574b096854 ]] 
}

