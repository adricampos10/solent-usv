@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle

rec def "OperatingMode" as E1  <<(T,blue) state  def>> [[psysml:250d3907-8e3b-42b4-b96a-8845a3117235 ]] {
