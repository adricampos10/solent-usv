@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
skinparam ranksep 60
skinparam nodesep 220
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

rec def "SolentContext" as E1  <<(T,blue) part  def>> [[psysml:d5ed59c4-56be-4bd3-b3a4-8b27381e06a1 ]] {
rec usage "usv: USV" as E2 [[psysml:00bb8e43-d936-409d-9246-3f9cca18cd7e ]] {
portin "^link: OperatorLink  " as E3  <<(T,blue) port>> [[psysml:2fee6737-6736-482f-bf9b-692b9eaccd31 ]] 
portin "^ais: Ais  " as E4  <<(T,blue) port>> [[psysml:f62997ff-700b-47a4-943d-469f7c850df0 ]] 
}
rec usage "operator: MissionOperator" as E5 [[psysml:c1e59e4f-7edc-4534-8985-46779c081d68 ]] {
portout "link: ~OperatorLink  " as E6  <<(T,blue) port>> [[psysml:5fdf4534-cb89-4c3f-9827-318e361af989 ]] 
}
rec usage "traffic: Vessel" as E7 [[psysml:b2c3d15c-c23f-453f-b2da-02f4164f9a83 ]] {
portout "ais: ~Ais  " as E8  <<(T,blue) port>> [[psysml:0d5d0fd9-0bcf-43fd-ac11-8864ffd1d445 ]] 
}
}
E6 -[thickness=3]- E3 [[psysml:7a2c8692-f618-46b8-ada0-e8ae098d7a26 ]] 
E8 -[thickness=3]- E4 [[psysml:87b84e51-3174-40f5-9cd8-26de6e132752 ]] 
@enduml

