@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
left to right direction
skinparam linetype ortho
skinparam ranksep 140
skinparam nodesep 60
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

rec def "SolentContext" as E1  <<(T,blue) part  def>> [[psysml:5bc4e1ff-14ee-4194-9194-ed5770c24310 ]] {
rec usage "usv: USV" as E2 [[psysml:dfb7515d-0d3d-4eff-ae6c-85d20a1570d2 ]] {
portin "^link: OperatorLink  " as E3  <<(T,blue) port>> [[psysml:cd05b9cc-bb6b-44ff-bad7-3d00a09d10ca ]] 
portin "^ais: Ais  " as E4  <<(T,blue) port>> [[psysml:e9a4e2df-49cf-4f10-87b0-7614a11bff29 ]] 
}
rec usage "operator: MissionOperator" as E5 [[psysml:a5a65537-f08b-4610-bf54-b9a89b711f89 ]] {
portout "link: ~OperatorLink  " as E6  <<(T,blue) port>> [[psysml:68251670-df98-4285-a06b-acd3b602f5e5 ]] 
}
rec usage "traffic: Vessel" as E7 [[psysml:84fa8691-5f0a-4616-adfd-b8149c879b53 ]] {
portout "ais: ~Ais  " as E8  <<(T,blue) port>> [[psysml:8fe86856-2875-4583-9068-ba164bedfd1f ]] 
}
}
E6 -[thickness=3]- E3 [[psysml:ceb299da-d2f4-4d3a-a078-9787b1cb61e4 ]] 
E8 -[thickness=3]- E4 [[psysml:fcd1aa58-932a-4636-a3c3-bf9c9b50e88d ]] 
@enduml

