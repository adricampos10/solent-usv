@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
skinparam ranksep 60
skinparam nodesep 220
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

rec def "SolentContext" as E1  <<(T,blue) part  def>> [[psysml:54222e79-cb29-41cc-99cc-17727956443a ]] {
rec usage "usv: USV" as E2 [[psysml:4a0f2dce-174c-4d89-9651-08b0c81f5f02 ]] {
portin "^link: OperatorLink  " as E3  <<(T,blue) port>> [[psysml:55559bbb-bd58-4e04-985c-4d0a563eda97 ]] 
portin "^ais: Ais  " as E4  <<(T,blue) port>> [[psysml:c0b1341d-ef94-488e-8037-463b748ce52b ]] 
}
rec usage "operator: MissionOperator" as E5 [[psysml:458e660a-207c-45c9-af28-9db741a19769 ]] {
portout "link: ~OperatorLink  " as E6  <<(T,blue) port>> [[psysml:abc6f2d2-8ae1-4cff-bda6-6d3f590d3c28 ]] 
}
rec usage "traffic: Vessel" as E7 [[psysml:68920cf7-5891-4370-afdc-968a62de8ccb ]] {
portout "ais: ~Ais  " as E8  <<(T,blue) port>> [[psysml:12be4c3b-79db-4a18-88e9-8227811f1829 ]] 
}
}
E6 -[thickness=3]- E3 [[psysml:bc84089d-e267-4290-88a0-75ab0fd75bdc ]] 
E8 -[thickness=3]- E4 [[psysml:d488f6b1-6f4b-478d-a538-eda3932f326f ]] 
@enduml

