@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

rec def "SolentContext" as E1  <<(T,blue) part  def>> [[psysml:fabe31a0-ccaa-4230-9f9a-686d43bedea1 ]] {
rec usage "usv: USV" as E2 [[psysml:cc2573c5-de42-4dbe-b24a-be03c6157533 ]] {
portin "^ais: AisPort  " as E3  <<(T,blue) port>> [[psysml:64d767c4-0b85-4dcb-b495-a9e2ecf2f821 ]] 
portin "^operatorLink: OperatorLinkPort  " as E4  <<(T,blue) port>> [[psysml:29e3f81f-37af-4b9d-9fa9-e5c618946d68 ]] 
}
rec usage "operator: MissionOperator" as E5 [[psysml:234073e3-b0a2-43b2-bcd1-83c7dc93c5e1 ]] {
portout "link: ~OperatorLinkPort  " as E6  <<(T,blue) port>> [[psysml:c81394d8-cfa7-4c5a-86bb-1e9484dbba9e ]] 
}
rec usage "traffic: Vessel" as E7 [[psysml:22d50d3e-88d7-4f2e-8b95-e0d5a88367ce ]] {
portout "ais: ~AisPort  " as E8  <<(T,blue) port>> [[psysml:706f192f-27fa-4b2e-8a3b-760a5985e78f ]] 
}
}
E6 -[thickness=3]- E4 [[psysml:47c664b5-89c0-4ce7-9f91-3c4ba996415d ]] 
E8 -[thickness=3]- E3 [[psysml:a7b7f3e1-4293-43ec-81ca-a162eee5630b ]] 
@enduml

